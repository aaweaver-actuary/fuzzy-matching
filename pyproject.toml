[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-matching"
version = "0.1.0"
description = "Reference feature implementations for conservative insurance carrier entity resolution."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
